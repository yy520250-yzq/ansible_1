---
# ============================================================
# hc_os 入口:探测提权能力 → 采集 → 判定/渲染
# 输出主机事实: hc_section_os_body / _title / _severity
# ============================================================
- name: 探测当前用户 euid
  ansible.builtin.command: id -u
  register: hc_euid
  changed_when: false
  failed_when: false

- name: 探测是否可免密 sudo(未 root 时)
  ansible.builtin.command: sudo -n true
  register: hc_sudo_test
  changed_when: false
  failed_when: false
  when: hc_euid.stdout | default('1') | int != 0
  ignore_errors: true

- name: 记录提权能力(完整体检依赖)
  ansible.builtin.set_fact:
    hc_root_ok: "{{ (hc_euid.stdout | default('1') | int == 0) or (hc_sudo_test.rc is defined and hc_sudo_test.rc == 0) }}"

- name: 系统专项 - 采集
  ansible.builtin.include_tasks: collect.yml

- name: 系统专项 - 判定与渲染
  ansible.builtin.include_tasks: render.yml
